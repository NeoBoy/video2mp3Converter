<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg.wasm Test</title>
</head>
<body>
    <h1>FFmpeg.wasm Test</h1>
    <p>Open console to see results</p>
    <button id="testBtn">Test FFmpeg Load</button>
    <div id="status"></div>

    <script type="module">
        import { FFmpeg } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
        import { toBlobURL } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

        const status = document.getElementById('status');
        const testBtn = document.getElementById('testBtn');
        
        testBtn.addEventListener('click', async () => {
            try {
                status.textContent = 'Loading FFmpeg...';
                console.log('Starting FFmpeg load...');
                
                const ffmpeg = new FFmpeg();
                
                ffmpeg.on('log', ({ message }) => {
                    console.log('[FFmpeg]:', message);
                });

                ffmpeg.on('progress', ({ progress }) => {
                    console.log('Progress:', Math.round(progress * 100) + '%');
                });

                // Use single-threaded build (no workers needed)
                const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
                
                console.log('Loading single-threaded FFmpeg core...');
                await ffmpeg.load({
                    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
                });

                console.log('✅ FFmpeg loaded successfully!');
                status.textContent = '✅ FFmpeg loaded successfully!';
                status.style.color = 'green';
                
            } catch (error) {
                console.error('❌ Error:', error);
                status.textContent = '❌ Error: ' + error.message;
                status.style.color = 'red';
            }
        });
    </script>
</body>
</html>
