<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cobalt API</title>
</head>
<body>
    <h1>Test YouTube Download API</h1>
    <input type="text" id="ytUrl" value="https://youtu.be/MU5astM2Jzc" style="width: 400px;">
    <button id="testBtn">Test API</button>
    <pre id="output" style="background: #f0f0f0; padding: 10px; margin-top: 10px;"></pre>

    <script>
        const testBtn = document.getElementById('testBtn');
        const ytUrl = document.getElementById('ytUrl');
        const output = document.getElementById('output');

        testBtn.addEventListener('click', async () => {
            const url = ytUrl.value.trim();
            output.textContent = 'Testing...\n';
            
            try {
                // Test Cobalt API
                output.textContent += 'Calling Cobalt API...\n';
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: url,
                        vCodec: 'h264',
                        vQuality: '720',
                        aFormat: 'mp3',
                        isAudioOnly: true
                    })
                });
                
                output.textContent += `Response status: ${response.status}\n`;
                output.textContent += `Response headers:\n${JSON.stringify([...response.headers.entries()], null, 2)}\n\n`;
                
                const result = await response.json();
                output.textContent += `Response body:\n${JSON.stringify(result, null, 2)}\n`;
                
            } catch (error) {
                output.textContent += `\n❌ Error: ${error.message}\n`;
                output.textContent += `Stack: ${error.stack}\n`;
            }
        });
    </script>
</body>
</html>
